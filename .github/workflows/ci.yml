name: CI

# RNF05: o DDL versionado precisa ser valido e aplicavel, verificado a cada
# commit contra um PostgreSQL limpo. Tres jobs independentes:
#  1. banco: aplica schema.sql + seed.sql + consultas analiticas e confere que
#     as views de contabilidade estao vazias.
#  2. api: build e testes (Testcontainers sobe o proprio PostgreSQL).
#  3. web: build do frontend.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: euduvido
          POSTGRES_PASSWORD: euduvido
          POSTGRES_DB: euduvido
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U euduvido"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: euduvido
      PGPASSWORD: euduvido
      PGDATABASE: euduvido
    steps:
      - uses: actions/checkout@v4

      - name: Aplica o schema
        run: psql -v ON_ERROR_STOP=1 -q -f database/scripts/ddl/schema.sql

      - name: Povoa o banco
        run: psql -v ON_ERROR_STOP=1 -q -f database/scripts/dml/seed.sql

      - name: Executa as consultas analiticas
        run: psql -v ON_ERROR_STOP=1 -q -o /dev/null -f database/scripts/queries/analytical_queries.sql

      - name: Confere a contabilidade (views devem estar vazias)
        run: |
          divergencias=$(psql -tA -c "SELECT (SELECT count(*) FROM vw_reconciliacao_saldo) + (SELECT count(*) FROM vw_escrow_orfao)")
          echo "linhas nas views de reconciliacao: $divergencias"
          test "$divergencias" -eq 0

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build EuDuvido.slnx
      - name: Testes
        run: dotnet test EuDuvido.slnx --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

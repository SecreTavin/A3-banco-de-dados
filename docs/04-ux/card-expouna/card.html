<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Nunito+Sans:wght@600;700;800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 900px; height: 1200px; overflow: hidden; background: #22143A; }
  .card { position: relative; width: 900px; height: 1200px; overflow: hidden;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, transparent 2px 28px),
      radial-gradient(circle at 50% 18%, #4A2C7A 0%, #2A1747 45%, #22143A 72%); }
  /* Metade de baixo so decorativa: o texto fica todo na de cima. */
  .fundo { position: absolute; left: 0; right: 0; bottom: 0; height: 600px; }
  .glifo { position: absolute; font: 900 520px/1 'Rubik', Arial, sans-serif; opacity: .08; color: #fff; }
  .moeda { position: absolute; display: grid; place-items: center; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFE9A8, #F6C453 45%, #C98F1E 100%);
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.18), 0 14px 30px rgba(0,0,0,.35);
    font: 900 28px/1 'Rubik', Arial, sans-serif; color: #7A4E00; }
  .topo { position: absolute; inset: 0 0 auto 0; height: 600px; display: flex; flex-direction: column;
    align-items: center; padding-top: 78px; text-align: center; }
  .marca { width: 104px; height: 92px; border-radius: 28px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(140deg, #5B43E8, #4433CC); box-shadow: 0 16px 40px rgba(68,51,204,.55);
    font: 900 54px/1 'Rubik', Arial, sans-serif; color: #fff; letter-spacing: 1px; }
  .marca em { font-style: normal; color: #F6C453; }
  .titulo { margin-top: 26px; }
  .frase { margin-top: 18px; width: 700px; font: 700 34px/1.3 'Nunito Sans', Arial, sans-serif; color: #EDE6F7; }
  .frase b { color: #F6C453; }
  .botao { margin-top: 36px; display: inline-flex; align-items: center; gap: 14px; padding: 20px 40px;
    border-radius: 18px; background: #F6C453; color: #22143A; font: 800 34px/1 'Rubik', Arial, sans-serif;
    box-shadow: 0 10px 0 #B8862A, 0 24px 40px rgba(0,0,0,.35); }
  .selo { position: absolute; left: 0; right: 0; top: 30px; text-align: center;
    font: 800 18px/1 'Nunito Sans', Arial, sans-serif; letter-spacing: 3px; text-transform: uppercase; color: #C9B8E8; }
</style>
</head>
<body>
<div class="card">
  <div class="fundo" aria-hidden="true">
    <span class="glifo" style="left:40px; bottom:-60px; transform:rotate(-12deg)">?</span>
    <span class="glifo" style="right:70px; bottom:-40px; transform:rotate(10deg); color:#F6C453; opacity:.12">!</span>
    <span class="moeda" style="width:120px; height:120px; left:350px; bottom:250px; font-size:40px">CP</span>
    <span class="moeda" style="width:84px; height:84px; left:520px; bottom:150px; transform:rotate(14deg)">CP</span>
    <span class="moeda" style="width:64px; height:64px; left:250px; bottom:110px; transform:rotate(-18deg); font-size:22px">CP</span>
    <span class="moeda" style="width:70px; height:70px; left:640px; bottom:330px; transform:rotate(8deg); font-size:24px">CP</span>
  </div>
  <div class="topo">
    <div class="marca">?<svg width="20" height="50" viewBox="0 0 20 50" aria-hidden="true"><rect x="3" y="4" width="14" height="30" rx="7" fill="#F6C453"/><circle cx="10" cy="43" r="6.5" fill="#F6C453"/></svg></div>
    <svg class="titulo" width="760" height="150" viewBox="0 0 760 150" aria-label="Eu Duvido!">
      <defs>
        <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#E0A21E"/>
        </linearGradient>
      </defs>
      <g font-family="Rubik, Arial, sans-serif" font-weight="800" font-size="128" text-anchor="end" letter-spacing="2">
        <text x="690" y="116" fill="none" stroke="#120A22" stroke-width="18" stroke-linejoin="round">Eu Duvido</text>
        <text x="690" y="116" fill="none" stroke="url(#ouro)" stroke-width="8" stroke-linejoin="round">Eu Duvido</text>
        <text x="690" y="116" fill="#FFFFFF">Eu Duvido</text>
      </g>
      <!-- O "!" desenhado: o glifo da fonte em peso alto fecha o vão entre o traço e o ponto. -->
      <g transform="translate(712 0)">
        <rect x="-17" y="22" width="34" height="68" rx="15" fill="#FFE08A" stroke="#120A22" stroke-width="10" paint-order="stroke"/>
        <circle cx="0" cy="108" r="16" fill="#FFE08A" stroke="#120A22" stroke-width="10" paint-order="stroke"/>
        <rect x="-17" y="22" width="34" height="68" rx="15" fill="url(#ouro)"/>
        <circle cx="0" cy="108" r="16" fill="url(#ouro)"/>
        <rect x="-7" y="30" width="7" height="34" rx="3.5" fill="#FFFFFF" opacity=".55"/>
      </g>
    </svg>
    <p class="frase">Desafios entre amigos com <b>prova</b>, <b>júri</b> e um banco de dados que não aceita calote.</p>
    <div class="botao">Desafie seus amigos <span>→</span></div>
  </div>
  <p class="selo">EXPOUNA 2026 · Projeto A3 · Banco de Dados</p>
</div>
</body>
</html>
